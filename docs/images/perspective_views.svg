<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 110" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .key-card { fill: #161b22; stroke: #30363d; stroke-width: 1.5; rx: 8px; }
      .key-cap { fill: #21262d; stroke: #484f58; stroke-width: 1.5; rx: 5px; }
      .key-num { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 14px; font-weight: 700; fill: #f0f6fc; text-anchor: middle; }
      .view-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 600; text-anchor: middle; }
      .view-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 10px; fill: #8b949e; text-anchor: middle; }
    </style>
  </defs>

  <rect width="880" height="110" class="bg" rx="10"/>

  <!-- Key 1: Dashboard -->
  <g transform="translate(25, 15)">
    <rect width="128" height="80" class="key-card"/>
    <rect x="47" y="10" width="34" height="26" class="key-cap"/>
    <text x="64" y="28" class="key-num">1</text>
    <text x="64" y="54" class="view-title" fill="#79c0ff">📊 Dashboard</text>
    <text x="64" y="70" class="view-sub">Mission Control</text>
  </g>

  <!-- Key 2: Month -->
  <g transform="translate(165, 15)">
    <rect width="128" height="80" class="key-card"/>
    <rect x="47" y="10" width="34" height="26" class="key-cap"/>
    <text x="64" y="28" class="key-num">2</text>
    <text x="64" y="54" class="view-title" fill="#7ee787">🗓️ Month Grid</text>
    <text x="64" y="70" class="view-sub">Macro Calendar</text>
  </g>

  <!-- Key 3: Sprint -->
  <g transform="translate(305, 15)">
    <rect width="128" height="80" class="key-card"/>
    <rect x="47" y="10" width="34" height="26" class="key-cap"/>
    <text x="64" y="28" class="key-num">3</text>
    <text x="64" y="54" class="view-title" fill="#f0883e">🏃 Sprint Board</text>
    <text x="64" y="70" class="view-sub">Agile Kanban</text>
  </g>

  <!-- Key 4: Week -->
  <g transform="translate(445, 15)">
    <rect width="128" height="80" class="key-card"/>
    <rect x="47" y="10" width="34" height="26" class="key-cap"/>
    <text x="64" y="28" class="key-num">4</text>
    <text x="64" y="54" class="view-title" fill="#d2a8ff">📅 Week Matrix</text>
    <text x="64" y="70" class="view-sub">Visual Capacity</text>
  </g>

  <!-- Key 5: Day -->
  <g transform="translate(585, 15)">
    <rect width="128" height="80" class="key-card"/>
    <rect x="47" y="10" width="34" height="26" class="key-cap"/>
    <text x="64" y="28" class="key-num">5</text>
    <text x="64" y="54" class="view-title" fill="#ff7b72">⏱️ Day Timeline</text>
    <text x="64" y="70" class="view-sub">Hourly Blocks</text>
  </g>

  <!-- Key 6: Analytics -->
  <g transform="translate(725, 15)">
    <rect width="128" height="80" class="key-card"/>
    <rect x="47" y="10" width="34" height="26" class="key-cap"/>
    <text x="64" y="28" class="key-num">6</text>
    <text x="64" y="54" class="view-title" fill="#58a6ff">📈 Analytics</text>
    <text x="64" y="70" class="view-sub">Deep Telemetry</text>
  </g>

</svg>