<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 370" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .container { fill: #161b22; stroke: #30363d; stroke-width: 1.5; rx: 8px; }
      .container-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #8b949e; letter-spacing: 0.5px; }
      
      .item-badge { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 11px; font-weight: 700; rx: 4px; }
      .badge-feat { fill: #1f3557; stroke: #388bfd; stroke-width: 1; }
      .text-feat { fill: #79c0ff; }
      
      .badge-def { fill: #3d1f28; stroke: #f85149; stroke-width: 1; }
      .text-def { fill: #ff7b72; }

      .badge-imp { fill: #2b1f3d; stroke: #a371f7; stroke-width: 1; }
      .text-imp { fill: #d2a8ff; }

      .badge-task { fill: #1f2d3d; stroke: #58a6ff; stroke-width: 1; }
      .text-task { fill: #79c0ff; }

      .badge-anchored { fill: #12281e; stroke: #2ea043; stroke-width: 1; }
      .text-anchored { fill: #7ee787; }

      .badge-rem { fill: #332514; stroke: #d29922; stroke-width: 1; }
      .text-rem { fill: #e3b341; }

      .badge-habit { fill: #132d3b; stroke: #26a69a; stroke-width: 1; }
      .text-habit { fill: #80cbc4; }

      .card-box { fill: #21262d; stroke: #30363d; stroke-width: 1; rx: 6px; }
      .card-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 500; fill: #f0f6fc; }
      .card-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 11px; fill: #8b949e; }
      
      .edge-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 11.5px; font-weight: 500; fill: #8b949e; text-anchor: middle; }
      .edge-path { stroke: #58a6ff; stroke-width: 1.8; fill: none; }
    </style>

    <marker id="arrow-down" viewBox="0 0 10 10" refX="5" refY="6" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1.5 0 L 5 8 L 8.5 0 z" fill="#58a6ff"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="880" height="370" class="bg" rx="10"/>

  <!-- ================= TIER 1: SPRINT / GLOBAL BACKLOG ================= -->
  <rect x="30" y="20" width="820" height="120" class="container"/>
  <text x="50" y="44" class="container-title">🗃️  SPRINT &amp; GLOBAL BACKLOG (Feature-Level Deliverables)</text>

  <!-- FEAT-1 Card -->
  <rect x="50" y="60" width="245" height="60" class="card-box"/>
  <rect x="62" y="70" width="56" height="20" class="item-badge badge-feat"/>
  <text x="90" y="84" class="item-badge text-feat" text-anchor="middle">FEAT-1</text>
  <text x="126" y="84" class="card-text">OAuth2 Social Logins</text>
  <text x="64" y="107" class="card-sub">🟢 8 Story Points • Sprint Goal</text>

  <!-- DEF-4 Card -->
  <rect x="317" y="60" width="245" height="60" class="card-box"/>
  <rect x="329" y="70" width="52" height="20" class="item-badge badge-def"/>
  <text x="355" y="84" class="item-badge text-def" text-anchor="middle">DEF-4</text>
  <text x="389" y="84" class="card-text">Audio Buffer Leak</text>
  <text x="331" y="107" class="card-sub">🔴 5 Story Points • High Priority</text>

  <!-- IMP-2 Card -->
  <rect x="584" y="60" width="245" height="60" class="card-box"/>
  <rect x="596" y="70" width="52" height="20" class="item-badge badge-imp"/>
  <text x="622" y="84" class="item-badge text-imp" text-anchor="middle">IMP-2</text>
  <text x="656" y="84" class="card-text">Fast JSON Serializer</text>
  <text x="598" y="107" class="card-sub">🟣 3 Story Points • Performance</text>

  <!-- Connecting Decomposition Arrow -->
  <path d="M 440 140 L 440 180" class="edge-path" marker-end="url(#arrow-down)"/>
  <rect x="375" y="150" width="130" height="20" fill="#0d1117" rx="4"/>
  <text x="440" y="164" class="edge-label">decomposes into</text>

  <!-- ================= TIER 2: EXECUTION LAYER ================= -->
  <rect x="30" y="188" width="820" height="162" class="container"/>
  <text x="50" y="212" class="container-title">⚡  EXECUTION LAYER (Day Timeline &amp; Todo Shelf)</text>

  <!-- Row 1: ANCHORED TASK -->
  <rect x="50" y="226" width="375" height="48" class="card-box"/>
  <text x="64" y="255" font-size="16">⏱️</text>
  <rect x="88" y="238" width="82" height="22" class="item-badge badge-anchored"/>
  <text x="129" y="253" class="item-badge text-anchored" text-anchor="middle">ANCHORED</text>
  <text x="178" y="249" class="card-text">09:00 - 10:30</text>
  <text x="178" y="264" class="card-sub">Team Sprint Planning &amp; Triage</text>

  <!-- Row 2: FLOATING TASK -->
  <rect x="445" y="226" width="385" height="48" class="card-box"/>
  <text x="459" y="255" font-size="16">📋</text>
  <rect x="483" y="238" width="76" height="22" class="item-badge badge-task"/>
  <text x="521" y="253" class="item-badge text-task" text-anchor="middle">FLOATING</text>
  <text x="567" y="249" class="card-text">TSK-10: Write unit tests for OAuth</text>
  <text x="567" y="264" class="card-sub">Todo Shelf • Linked to FEAT-1</text>

  <!-- Row 3: REMINDER -->
  <rect x="50" y="286" width="375" height="48" class="card-box"/>
  <text x="64" y="315" font-size="16">🔔</text>
  <rect x="88" y="298" width="76" height="22" class="item-badge badge-rem"/>
  <text x="126" y="313" class="item-badge text-rem" text-anchor="middle">REMINDER</text>
  <text x="172" y="309" class="card-text">Submit weekly timesheet</text>
  <text x="172" y="324" class="card-sub">Due Today at 17:00</text>

  <!-- Row 4: HABIT -->
  <rect x="445" y="286" width="385" height="48" class="card-box"/>
  <text x="459" y="315" font-size="16">🔄</text>
  <rect x="483" y="298" width="60" height="22" class="item-badge badge-habit"/>
  <text x="513" y="313" class="item-badge text-habit" text-anchor="middle">HABIT</text>
  <text x="551" y="309" class="card-text">Morning stretch &amp; hydration streak</text>
  <text x="551" y="324" class="card-sub">Recurring Daily • 14 Days Streak</text>

</svg>