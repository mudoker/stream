<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 200" width="100%" height="100%">
  <defs>
    <style>
      .window-bg { fill: #0d1117; stroke: #30363d; stroke-width: 1.5; rx: 10px; }
      .title-bar { fill: #161b22; }
      .win-title { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 11px; fill: #8b949e; text-anchor: middle; }
      
      .session-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #f0f6fc; }
      .timer-big { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 15px; font-weight: 700; fill: #79c0ff; }
      
      .prog-bg { fill: #21262d; rx: 4px; }
      .prog-fill { fill: url(#prog-grad); rx: 4px; }
      
      .metric-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 500; fill: #8b949e; }
      .metric-val { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 12px; font-weight: 700; fill: #f0f6fc; }
      
      .kbd-pill { fill: #21262d; stroke: #484f58; stroke-width: 1; rx: 4px; }
      .kbd-text { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 11px; font-weight: 600; fill: #79c0ff; }
      .action-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 11px; fill: #8b949e; }
    </style>
    
    <linearGradient id="prog-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#388bfd" />
      <stop offset="100%" stop-color="#a371f7" />
    </linearGradient>
  </defs>

  <!-- Window Frame -->
  <rect width="880" height="200" class="window-bg"/>
  
  <!-- Title bar -->
  <path d="M 0 10 Q 0 0 10 0 L 870 0 Q 880 0 880 10 L 880 32 L 0 32 Z" class="title-bar"/>
  <circle cx="20" cy="16" r="5" fill="#ff5f56"/>
  <circle cx="36" cy="16" r="5" fill="#ffbd2e"/>
  <circle cx="52" cy="16" r="5" fill="#27c93f"/>
  <text x="440" y="20" class="win-title">stream — zen focus session HUD</text>

  <!-- Session Title -->
  <text x="35" y="65" class="session-title">🧘 FOCUS SESSION: Refactor Authentication Middleware</text>
  <text x="845" y="65" class="timer-big" text-anchor="end">21:45 / 25:00 (87%)</text>

  <!-- Progress Bar -->
  <rect x="35" y="80" width="810" height="12" class="prog-bg"/>
  <rect x="35" y="80" width="705" height="12" class="prog-fill"/>

  <!-- Metrics Row -->
  <g transform="translate(35, 122)">
    <text class="metric-label">🔥 Interruption Count: <tspan class="metric-val">0</tspan></text>
    <text x="250" class="metric-label">🎯 Current Block: <tspan class="metric-val">1 of 4</tspan></text>
    <text x="470" class="metric-label">🎷 Ambient Soundscape: <tspan class="metric-val" fill="#7ee787">Jazz Lounge (Rain + Rhodes)</tspan></text>
  </g>

  <!-- Action Shortcuts Row -->
  <g transform="translate(35, 165)">
    <!-- Space -->
    <rect x="0" y="-14" width="56" height="20" class="kbd-pill"/>
    <text x="7" y="0" class="kbd-text">Space</text>
    <text x="62" y="0" class="action-desc">Pause</text>

    <!-- + -->
    <rect x="120" y="-14" width="24" height="20" class="kbd-pill"/>
    <text x="127" y="0" class="kbd-text">+</text>
    <text x="150" y="0" class="action-desc">Add 5m</text>

    <!-- b -->
    <rect x="215" y="-14" width="24" height="20" class="kbd-pill"/>
    <text x="222" y="0" class="kbd-text">b</text>
    <text x="245" y="0" class="action-desc">Take Break</text>

    <!-- Esc -->
    <rect x="330" y="-14" width="38" height="20" class="kbd-pill"/>
    <text x="337" y="0" class="kbd-text">Esc</text>
    <text x="374" y="0" class="action-desc">Run in Background</text>

    <!-- i -->
    <rect x="500" y="-14" width="24" height="20" class="kbd-pill"/>
    <text x="507" y="0" class="kbd-text">i</text>
    <text x="530" y="0" class="action-desc">Log Interruption</text>
  </g>

</svg>